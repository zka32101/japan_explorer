name: japan_explorer
description: "Japan Explorer - AI-Powered Japan Travel App"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.6
  firebase_crashlytics: ^4.3.5

  # Auth
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3

  # Navigation
  go_router: ^14.8.1

  # UI
  easy_localization: ^3.0.7
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0

  # Camera & Image
  image_picker: ^1.1.2
  camera: ^0.11.1

  # Location & Maps
  geolocator: ^13.0.4
  google_maps_flutter: ^2.17.0

  # Audio & TTS
  flutter_tts: ^4.2.2
  flutter_local_notifications: ^18.0.1

  # Networking
  dio: ^5.8.0+1
  http: ^1.2.2
  url_launcher: ^6.3.1

  # Storage
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4

  # Utils
  uuid: ^4.5.1
  logger: ^2.5.0
  intl: ^0.20.2
  image: ^4.5.4
  shimmer: ^3.0.0
  package_info_plus: ^8.0.0
  purchases_flutter: ^10.2.2
  firebase_app_check: ^0.3.1
  connectivity_plus: ^6.1.3
  hive_flutter: ^1.1.0
  share_plus: ^10.1.4
  in_app_review: ^2.0.9
  youtube_player_flutter: ^9.1.1
  flutter_inappwebview: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  json_serializable: ^6.9.4
  freezed: ^3.1.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

  # Testing
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.1.0
  network_image_mock: ^2.1.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/

  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700

# ── App icon generation (dart run flutter_launcher_icons) ─────────────────────
# Place a 1024×1024 PNG at assets/icons/app_icon.png before running.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#E63946"
  adaptive_icon_foreground: "assets/icons/app_icon_fg.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# ── Splash screen generation (dart run flutter_native_splash:create) ──────────
flutter_native_splash:
  color: "#E63946"
  color_dark: "#0A0A1A"
  image: assets/icons/splash_logo.png
  image_dark: assets/icons/splash_logo.png
  android: true
  ios: true
  fullscreen: true
  android_12:
    color: "#E63946"
    color_dark: "#0A0A1A"
    image: assets/icons/splash_logo.png
    image_dark: assets/icons/splash_logo.png
