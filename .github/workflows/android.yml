name: Android Build and Release

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      - run: flutter pub get
      - name: flutter analyze (fail only on real errors)
        run: |
          flutter analyze > analyze_output.txt 2>&1 || true
          cat analyze_output.txt
          if grep -q "error •" analyze_output.txt; then
            echo "::error::flutter analyze found real errors"
            exit 1
          fi
      - run: flutter test

  build-android-unsigned:
    needs: analyze-and-test
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      - run: flutter pub get

      - name: Build APK (unsigned, PR only)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  build-android-signed:
    needs: analyze-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      - run: flutter pub get

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=STORE_FILE=keystore.jks \
            --dart-define=STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD \
            --dart-define=KEY_ALIAS=$ANDROID_KEY_ALIAS \
            --dart-define=KEY_PASSWORD=$ANDROID_KEY_PASSWORD

      - name: Build App Bundle (for Play Store)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --dart-define=STORE_FILE=keystore.jks \
            --dart-define=STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD \
            --dart-define=KEY_ALIAS=$ANDROID_KEY_ALIAS \
            --dart-define=KEY_PASSWORD=$ANDROID_KEY_PASSWORD

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Optional: Upload to Google Play Console (requires setup)
      # - name: Upload to Play Console
      #   uses: r0adkll/upload-google-play@v1
