name: Android Build and Release

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      - run: flutter pub get
      - name: flutter analyze (fail only on real errors)
        run: |
          flutter analyze > analyze_output.txt 2>&1 || true
          cat analyze_output.txt
          if grep -q "error •" analyze_output.txt; then
            echo "::error::flutter analyze found real errors"
            exit 1
          fi
      - run: flutter test

  build-android-unsigned:
    needs: analyze-and-test
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      - run: flutter pub get

      - name: Write placeholder google-services.json (build-only, not real credentials)
        run: |
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789",
              "firebase_url": "https://ci-placeholder-project.firebaseio.com",
              "project_id": "ci-placeholder-project",
              "storage_bucket": "ci-placeholder-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.yourwish.japanexplorer"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "CI_PLACEHOLDER_NOT_A_REAL_KEY"
                  }
                ],
                "services": {
                  "analytics_service": {
                    "analytics_enabled": false
                  },
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  },
                  "ads_service": {
                    "status": 1
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build APK (unsigned, PR only)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  build-android-signed:
    needs: analyze-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      - run: flutter pub get

      - name: Write google-services.json from secret
        run: |
          echo "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}" > android/app/google-services.json

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=STORE_FILE=keystore.jks \
            --dart-define=STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD \
            --dart-define=KEY_ALIAS=$ANDROID_KEY_ALIAS \
            --dart-define=KEY_PASSWORD=$ANDROID_KEY_PASSWORD

      - name: Build App Bundle (for Play Store)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --dart-define=STORE_FILE=keystore.jks \
            --dart-define=STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD \
            --dart-define=KEY_ALIAS=$ANDROID_KEY_ALIAS \
            --dart-define=KEY_PASSWORD=$ANDROID_KEY_PASSWORD

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Optional: Upload to Google Play Console (requires setup)
      # - name: Upload to Play Console
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
      #     packageName: com.yourwish.japanexplorer
      #     releaseFiles: 'build/app/outputs/bundle/release/app-release.aab'
      #     track: internal
