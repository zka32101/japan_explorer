name: Build and Deploy Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Get dependencies
        run: flutter pub get

      # android/app/google-services.json is intentionally gitignored (real
      # Firebase credentials must never be committed). This build is a real,
      # tag-triggered release artifact, so — like ios.yml's build-ios-signed
      # job — it needs the actual production Firebase config, decoded here
      # from a repo secret (base64 of the real file from the Firebase
      # console). Without this secret set, the google-services Gradle
      # plugin will fail the build with a clear "file missing" error rather
      # than silently shipping a non-functional Firebase config.
      - name: Decode google-services.json
        run: |
          echo "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      # local.properties (gitignored) holds the Google Maps API key that
      # android/app/build.gradle.kts reads into manifestPlaceholders.
      - name: Write local.properties
        run: echo "MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" > local.properties

      # Decode keystore from base64-encoded GitHub secret and set up signing
      - name: Decode keystore and setup signing configuration
        run: |
          # Decode base64 keystore from GitHub secret
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/keystore/japan_explorer_release.jks

          # Verify keystore is valid and can be opened with the store password
          keytool -list -keystore android/keystore/japan_explorer_release.jks -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" && echo "✓ Keystore verification passed"

          # Create signing config file that Gradle will read
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=keystore/japan_explorer_release.jks
          EOF

      - name: Build App Bundle
        run: flutter build appbundle --release

      # Uploads to the "internal" track as a draft — a human still has to
      # promote it to production (or a wider track) from Play Console.
      # Requires a Play Console service account (Setup > API access) with
      # Release Manager permission, JSON key stored as a repo secret.
      - name: Upload to Google Play (internal track, draft)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.yourwish.japanexplorer
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-explorer-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 7
