name: Build and Deploy APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      
      - name: Get dependencies
        run: flutter pub get

      # android/app/google-services.json is intentionally gitignored (real
      # Firebase credentials must never be committed). This build is a real,
      # tag-triggered release artifact, so — like ios.yml's build-ios-signed
      # job — it needs the actual production Firebase config, decoded here
      # from a repo secret (base64 of the real file from the Firebase
      # console). Without this secret set, the google-services Gradle
      # plugin will fail the build with a clear "file missing" error rather
      # than silently shipping a non-functional Firebase config.
      - name: Decode google-services.json
        run: |
          echo "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        run: echo "APK built and ready for deployment"
