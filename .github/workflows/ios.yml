name: iOS Build and TestFlight

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      - run: flutter pub get
      - name: flutter analyze (fail only on real errors)
        # `flutter analyze` exits 1 on any info/warning-level lint too, and
        # this repo carries ~3700 pre-existing info/warning lints. Gate CI on
        # actual `error •` lines only — full lint cleanup is tracked separately.
        run: |
          flutter analyze > analyze_output.txt 2>&1 || true
          cat analyze_output.txt
          if grep -q "error •" analyze_output.txt; then
            echo "::error::flutter analyze found real errors"
            exit 1
          fi
      - run: flutter test

  build-ios-unsigned:
    needs: analyze-and-test
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      - run: flutter pub get

      # ios/Runner/GoogleService-Info.plist is intentionally gitignored (real
      # Firebase credentials must never be committed — see .gitignore). Xcode
      # still requires the file to exist as a Copy Bundle Resources input, so
      # this job writes throwaway placeholder values good enough to satisfy
      # the build step. This build is --no-codesign and never run or
      # shipped, so a non-functional Firebase config is fine here. The real
      # signed/TestFlight build (build-ios-signed) decodes the actual config
      # from a repo secret instead — see that job below.
      - name: Write placeholder GoogleService-Info.plist (build-only, not real credentials)
        run: |
          cat > ios/Runner/GoogleService-Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CLIENT_ID</key>
            <string>000000000000-ci0000000000000000000000000.apps.googleusercontent.com</string>
            <key>REVERSED_CLIENT_ID</key>
            <string>com.googleusercontent.apps.000000000000-ci0000000000000000000000000</string>
            <key>API_KEY</key>
            <string>CI-PLACEHOLDER-NOT-A-REAL-KEY</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.yourwish.japanexplorer</string>
            <key>PROJECT_ID</key>
            <string>ci-placeholder-project</string>
            <key>STORAGE_BUCKET</key>
            <string>ci-placeholder-project.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <false/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000000000</string>
          </dict>
          </plist>
          EOF

      - run: flutter build ios --release --no-codesign

  build-ios-signed:
    needs: analyze-and-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      # ios/Runner/GoogleService-Info.plist is intentionally gitignored (real
      # Firebase credentials must never be committed). This is the real,
      # signed TestFlight build, so — unlike build-ios-unsigned's throwaway
      # placeholder — it needs the actual production Firebase config,
      # decoded here from a repo secret (base64 of the real file from the
      # Firebase console, same pattern as the signing cert/profile below).
      - name: Decode GoogleService-Info.plist
        run: |
          echo "${{ secrets.IOS_GOOGLESERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Decode signing certificate
        run: |
          echo "${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}" | base64 --decode > ios_distribution.p12

      - name: Decode provisioning profile
        run: |
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Import certificate into keychain
        env:
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: temporary-ci-keychain-password
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed 's/"//g')

          # Apple's WWDR G3 intermediate cert must be present for the chain
          # of trust to validate — without it, `security find-identity` (and
          # therefore flutter's own signing precheck) reports zero valid
          # identities even though the .p12 import itself "succeeds".
          curl -sSL -o wwdr_g3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import wwdr_g3.cer -k build.keychain -T /usr/bin/codesign

          security import ios_distribution.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          echo "── Valid codesigning identities ──"
          security find-identity -v -p codesigning build.keychain

      - run: flutter pub get

      # Manual signing (CODE_SIGN_STYLE/DEVELOPMENT_TEAM/CODE_SIGN_IDENTITY/
      # PROVISIONING_PROFILE_SPECIFIER) is committed directly in the Runner
      # target's Release config in project.pbxproj — no CI-side sed needed.
      - run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          xcrun altool --upload-app -f build/ios/ipa/*.ipa -t ios \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-explorer-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7
